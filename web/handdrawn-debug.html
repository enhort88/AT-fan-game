<!doctype html><meta charset="utf-8"><title>Hand drawn sprite check</title><style>body{font-family:sans-serif;background:#ddd}#g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.c{background:white;border-radius:12px;padding:8px;text-align:center}.c>div{height:190px;display:flex;align-items:center;justify-content:center}.c canvas{width:175px;height:175px}</style><h1>Проверка вырезки персонажей</h1><div id="g"></div><script src="art.js"></script><script src="art-secondary.js"></script><script src="block-art.js"></script><script src="atlas-part-0.js"></script><script src="atlas-part-1.js"></script><script src="atlas-part-2.js"></script><script src="atlas-part-3.js"></script><script src="atlas-part-4.js"></script><script src="atlas-part-5.js"></script><script src="handdrawn-art.js"></script><script>setTimeout(()=>{const ids=Object.keys(AT_HANDDRAWN.characters);g.innerHTML=ids.map(id=>`<div class=c><div>${AT_ART.characterArt(id)}</div><b>${id}</b></div>`).join('');AT_HANDDRAWN.paintAll()},100)</script>
